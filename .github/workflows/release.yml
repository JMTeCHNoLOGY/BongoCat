name: BongoCat Release

run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate tag and create draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}." >&2
            exit 1
          fi

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "BongoCat ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          release_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.id')"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

  build-app:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS x86_64
            runner: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows ARM64
            runner: windows-11-arm
            platform: windows
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Windows x86_64
            runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux ARM64 DEB and RPM
            runner: ubuntu-22.04-arm
            platform: linux
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
          - name: Linux x86_64 DEB and RPM
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 1
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][setup][ext]'
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json

  publish-release:
    name: Publish release
    needs:
      - create-release
      - build-app
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets

      - name: Verify platform coverage and create checksums
        shell: bash
        run: |
          [[ "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -ge 2 ]]
          [[ "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -ge 2 ]]
          [[ "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -ge 2 ]]
          [[ "$(find release-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -ge 2 ]]
          (
            cd release-assets
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Upload checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
